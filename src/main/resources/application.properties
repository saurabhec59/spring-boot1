spring.application.name=spring-boot1
spring.jpa.show-sql=true

# Database Configuration - uses environment variables
# DB name is hardcoded (spring_dev), other values from env vars
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/spring_dev
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Security Configuration
spring.security.user.name=user
spring.security.user.password=password

# JWT Configuration - must be provided via environment variable
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration.seconds=3600