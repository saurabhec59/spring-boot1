# Test Configuration - Uses PostgreSQL spring_test database
# This file is loaded automatically when running tests
# Requires environment variables to be set (same as main application)

# Database Configuration - uses environment variables
# DB name is hardcoded (spring_test), other values from env vars
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/spring_test
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration for Tests
# create-drop = Creates tables on test start, drops them on test end
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration - uses environment variable (same as main application)
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration.seconds=3600
